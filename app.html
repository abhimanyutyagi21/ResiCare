<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ResiCare — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  (function () {
    var pref = localStorage.getItem('resicare_theme') || 'light';
    var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
</head>
<body>
<div id="root"></div>
<div id="toast-root" style="position:fixed;bottom:20px;right:20px;z-index:100;max-width:90vw;"></div>
<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
